apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-ingress
  
spec:
  ingressClassName: alb

  rules:
    - host: app1.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-frontend
                port:
                  number: 80
